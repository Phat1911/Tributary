# Round-2 adversarial probe crate (senior security tester). UNTRACKED —
# deleted after the run. Own [workspace] so the repo root never sees it.
# DBs: in-memory SQLite only (cfg(windows) interop), unique per test —
# never trib_test_ci / m4test.
[package]
name = "probe-scan2-cls"
version = "0.1.0"
edition = "2021"

[workspace]

# UNC target dir (Windows cargo interop) cannot host incremental locks.
[profile.dev]
incremental = false

[profile.test]
incremental = false

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tributary-common = { path = "../crates/common" }
tributary-control = { path = "../crates/control" }
tributary-crypto = { path = "../crates/crypto" }
tributary-gateway = { path = "../crates/gateway" }
