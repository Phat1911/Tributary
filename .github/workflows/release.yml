name: Release

# Tag a version (v*) → build the multi-arch image and push it to GHCR,
# tagged with both the semver tag and `latest` (SPEC §13 CI/CD row:
# "tag → multi-arch image → GHCR"). The dashboard pnpm build runs INSIDE
# image stage 1 — nothing node-based is needed in this workflow.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY_IMAGE: ghcr.io/phat1911/tributary

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Docker (amd64 + arm64 → GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (semver tag + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root: the Dockerfile builds BOTH stages
          # (dashboard static export + Rust release binary).
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
