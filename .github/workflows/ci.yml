name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dual-DB tests: SQLite tempfile runs always; Postgres half runs when
      # this is set (AGENTS.md: every query works on both backends).
      TRIBUTARY_TEST_DATABASE_URL: postgres://tributary:tributary@localhost:5432/tributary_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # ---- Pool program (SBF) prerequisite --------------------------------
      # The pool test suites load the REAL compiled artifact into the SBPF
      # VM (AUDIT A-034: host-builtins are untestable under program-test
      # 4.1.2 — the ELF is the test subject). CI must therefore build the
      # same `target/deploy/pool.so` the dev box builds, BEFORE `cargo
      # test`. A missing ELF is a hard harness assert (rule 6: never
      # skip-if-artifact-missing — the tests must run and pass every push).
      - name: Cache the Solana SBF toolchain
        uses: actions/cache@v4
        with:
          # install dir = the pinned anza release; ~/.cache/solana =
          # platform-tools; programs/pool/target = the SBF build tree
          # (NOT covered by rust-cache, which only sees the workspace
          # target/). Keyed on the lockfile so dep changes rebuild.
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            programs/pool/target
          key: solana-sbf-v4.1.2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: solana-sbf-v4.1.2-${{ runner.os }}-
      - name: Install the Solana toolchain (pinned v4.1.2 — the A-033 lattice's own)
        # Pinned to the exact channel the Cargo.lock lattice was built for
        # (agave v4.1.2; a newer CLI's cargo-build-sbf may pull a newer
        # platform-tools/SDK and is NOT validated by this repo).
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            curl -sSfL https://release.anza.xyz/v4.1.2/install | sh -s -- --no-modify-path
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the pool program (SBF v3)
        # No program keypair exists in CI; cargo-build-sbf generates an
        # ephemeral one. The embedded address never enters execution —
        # tests register the program at declare_id! and derive every PDA
        # from it, so CI's ELF is functionally identical to the devnet one.
        run: cargo-build-sbf --arch v3
        working-directory: programs/pool
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (geoip feature)
        # The optional geoip build must stay warning-clean too (SPEC §9
        # dormant-feature discipline; maxminddb is optional, not exempt).
        run: cargo clippy -p tributary-gateway --features geoip -- -D warnings
      - name: Test
        run: cargo test --workspace

  dashboard:
    name: Dashboard (pnpm install, lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm -C apps/dashboard lint
      - name: Typecheck dashboard
        run: pnpm -C apps/dashboard typecheck
      - name: Build dashboard
        run: pnpm -C apps/dashboard build

  e2e:
    name: Dashboard E2E (Playwright — J6 journey + F1 budget wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the static export
        run: pnpm -C apps/dashboard build:export
      # Browsers land where scripts/e2e_j6.py points PLAYWRIGHT_BROWSERS_PATH;
      # the runner itself pins the CLI version (npx -y playwright@1.56.1).
      - name: Install Chromium for Playwright
        run: pnpm -C apps/dashboard exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/pw-browsers
      - name: Run the browser journeys (boots the real stack first)
        run: python3 scripts/e2e_j6.py

  sdk-contract:
    name: OpenAI SDK contract (J7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install the official SDKs
        # Dev-only installs, outside package manifests on purpose (the
        # contract is exercised with the OFFICIAL clients, not a vendored
        # version): Python SDK into target/sdk-py, JS SDK via npm.
        run: |
          python3 -m pip install --target target/sdk-py openai
          npm install openai
      - name: Run the contract test
        run: python3 scripts/contract_openai_sdk.py

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
