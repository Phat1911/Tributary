name: CI

on:
  push:
    # Doctrine-suite branches ride the push trigger deliberately
    # (doctrine-suite mode, AGENTS.md step 14): Session A's suite is
    # EXPECTED-RED on the branch, and the red run IS the GO-gate artifact.
    # Drop each branch from this list when its milestone closes on main.
    # m9/doctrine-suite: M9-A (2026-11-11). m11/doctrine-suite: M11-A
    # (2026-11-26) — red on the Rust job ONLY because of the M11 tests.
    branches: [main, m9/doctrine-suite, m11/doctrine-suite]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dual-DB tests: SQLite tempfile runs always; Postgres half runs when
      # this is set (AGENTS.md: every query works on both backends).
      TRIBUTARY_TEST_DATABASE_URL: postgres://tributary:tributary@localhost:5432/tributary_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # ---- Pool program (SBF) prerequisite --------------------------------
      # The pool test suites load the REAL compiled artifact into the SBPF
      # VM (AUDIT A-034: host-builtins are untestable under program-test
      # 4.1.2 — the ELF is the test subject). CI must therefore build the
      # same `target/deploy/pool.so` the dev box builds, BEFORE `cargo
      # test`. A missing ELF is a hard harness assert (rule 6: never
      # skip-if-artifact-missing — the tests must run and pass every push).
      - name: Cache the Solana SBF toolchain
        uses: actions/cache@v4
        with:
          # install dir = the pinned anza release; ~/.cache/solana =
          # platform-tools; programs/pool/target = the SBF build tree
          # (NOT covered by rust-cache, which only sees the workspace
          # target/). Keyed on the lockfile so dep changes rebuild.
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            programs/pool/target
          key: solana-sbf-v4.1.2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: solana-sbf-v4.1.2-${{ runner.os }}-
      - name: Install the Solana toolchain (pinned v4.1.2 — the A-033 lattice's own)
        # Pinned to the exact channel the Cargo.lock lattice was built for
        # (agave v4.1.2; a newer CLI's cargo-build-sbf may pull a newer
        # platform-tools/SDK and is NOT validated by this repo).
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            # The wrapper embeds its release, but ONLY forwards it when no
            # args are given — with a flag we must restate the version
            # (lesson of run 41264504296: "Please specify the release").
            curl -sSfL https://release.anza.xyz/v4.1.2/install | sh -s -- v4.1.2 --no-modify-path
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the pool program (SBF v3)
        # No program keypair exists in CI; cargo-build-sbf generates an
        # ephemeral one. The embedded address never enters execution —
        # tests register the program at declare_id! and derive every PDA
        # from it, so CI's ELF is functionally identical to the devnet one.
        run: cargo-build-sbf --arch v3
        working-directory: programs/pool
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (geoip feature)
        # The optional geoip build must stay warning-clean too (SPEC §9
        # dormant-feature discipline; maxminddb is optional, not exempt).
        run: cargo clippy -p tributary-gateway --features geoip -- -D warnings
      - name: Test
        # M9-D (2026-11-19): the workspace run EXCLUDES tributary-gateway,
        # whose binaries are enumerated in the next step — because
        # `crates/gateway/tests/m9c_audit_poc.rs` is Session C's
        # assert-the-EXPLOIT standing-pin suite, EDIT-FROZEN by the M9-D
        # kickoff (no ruling names its tests; the M8 fix session instead
        # flipped its PoCs — this session's directive deliberately keeps
        # them red). Its 10 exploit pins are EXPECTED-RED forever after
        # (green there = an exploit is LIVE AGAIN), verified as a first-
        # class invariant by the "Standing pins" step below — so the
        # green-must-pass run must not include that binary. --no-fail-fast
        # stays (doctrine GO-gate precedent): every failing binary is
        # surfaced, never hidden behind the first failure.
        run: cargo test --workspace --exclude tributary-gateway --no-fail-fast
      - name: Test (gateway binaries, m9c standing pins excluded)
        # The gateway's own suites — lib + bins + every integration binary
        # EXCEPT the frozen m9c PoC suite (see the step above; the pins
        # get their own verdict below). A new integration binary added
        # later MUST be appended here or CI silently stops running it.
        run: >
          cargo test -p tributary-gateway --lib --bins --no-fail-fast &&
          cargo test -p tributary-gateway --no-fail-fast
          --test api --test concurrency --test m2_isolation --test m4_journeys
          --test m55_gemini --test m5_journeys --test m9_doctrine
          --test m9d_fix_pins --test streaming
      - name: Standing pins (m9c — exploits MUST stay dead)
        # The frozen PoC suite's verdict, INVERTED into the green
        # contract: CI passes iff exactly the 10 exploit pins are RED
        # (their findings fixed) and exactly the 2 clean probes are GREEN
        # (honest behavior intact). A poc_* going green means its exploit
        # regressed; a clean_* going red means the honest edges broke.
        # Either way this step fails LOUD — the pins are the spec.
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          if cargo test -p tributary-gateway --test m9c_audit_poc --no-fail-fast >"$LOG" 2>&1; then
            echo "::error::m9c went ALL GREEN — an exploit PoC passing means its finding is live again"
            exit 1
          fi
          PASSED=$(grep -c '^test .* \.\.\. ok' "$LOG" || true)
          FAILED=$(grep -c '^test .* \.\.\. FAILED' "$LOG" || true)
          if [ "$PASSED" -ne 2 ] || [ "$FAILED" -ne 10 ]; then
            echo "::error::expected 2 green clean probes + 10 red exploit pins, got $PASSED green / $FAILED red"
            grep '^test ' "$LOG" || true
            exit 1
          fi
          for clean in clean_fee_band_edges_and_window_validation_hold \
                       clean_mid_window_deposit_and_row_reconciliation_hold; do
            grep -q "^test $clean \.\.\. ok" "$LOG" || {
              echo "::error::clean probe $clean is not green"; exit 1; }
          done
          echo "standing pins hold: 10 exploit PoCs red (exploits dead), 2 clean probes green"
          grep '^test ' "$LOG"

  dashboard:
    name: Dashboard (pnpm install, lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm -C apps/dashboard lint
      - name: Typecheck dashboard
        run: pnpm -C apps/dashboard typecheck
      - name: Build dashboard
        run: pnpm -C apps/dashboard build

  e2e:
    name: Dashboard E2E (Playwright — J6 journey + F1 budget wire)
    # Pinned to 24.04 (2026-11-11): ubuntu-latest moved to 26.04 and
    # Playwright's browser install cannot target ubuntu26.04-x64 yet
    # ("Playwright does not support chromium on ubuntu26.04-x64" —
    # pre-existing main red, run 42730913935). Unpin when Playwright
    # ships 26.04 browser builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the static export
        run: pnpm -C apps/dashboard build:export
      # Browsers land where scripts/e2e_j6.py points PLAYWRIGHT_BROWSERS_PATH;
      # the runner itself pins the CLI version (npx -y playwright@1.56.1).
      #
      # 2026-11-11: `--with-deps` needs apt, and the runner's Ubuntu-mirror
      # DNS was down for 75+ minutes (five E2E reds across five fresh
      # runners, azure AND primary mirrors unresolvable, apt exit 100
      # BEFORE any test ran; npm/crates.io/GitHub resolved fine). The
      # ubuntu-24.04 image ships SYSTEM Chromium 156 — i.e. every runtime
      # lib Playwright's build links — so the deps install is belt-and-
      # braces here: try it, and on apt failure fall back to the plain
      # browser download. Playwright validates host libs at launch and
      # names anything missing, so a real gap fails loud, never silent.
      - name: Install Chromium for Playwright (deps best-effort)
        run: |
          pnpm -C apps/dashboard exec playwright install --with-deps chromium \
            || { echo "::warning::apt --with-deps failed (mirror outage?) — installing browser only; system Chromium libs are on the image"; \
                 pnpm -C apps/dashboard exec playwright install chromium; }
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/pw-browsers
      - name: Run the browser journeys (boots the real stack first)
        run: python3 scripts/e2e_j6.py

  sdk-contract:
    name: OpenAI SDK contract (J7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install the official SDKs
        # Dev-only installs, outside package manifests on purpose (the
        # contract is exercised with the OFFICIAL clients, not a vendored
        # version): Python SDK into target/sdk-py, JS SDK via npm.
        run: |
          python3 -m pip install --target target/sdk-py openai
          npm install openai
      - name: Run the contract test
        run: python3 scripts/contract_openai_sdk.py

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
