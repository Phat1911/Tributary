name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dual-DB tests: SQLite tempfile runs always; Postgres half runs when
      # this is set (AGENTS.md: every query works on both backends).
      TRIBUTARY_TEST_DATABASE_URL: postgres://tributary:tributary@localhost:5432/tributary_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (geoip feature)
        # The optional geoip build must stay warning-clean too (SPEC §9
        # dormant-feature discipline; maxminddb is optional, not exempt).
        run: cargo clippy -p tributary-gateway --features geoip -- -D warnings
      - name: Test
        run: cargo test --workspace

  dashboard:
    name: Dashboard (pnpm install, lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm -C apps/dashboard lint
      - name: Typecheck dashboard
        run: pnpm -C apps/dashboard typecheck
      - name: Build dashboard
        run: pnpm -C apps/dashboard build

  sdk-contract:
    name: OpenAI SDK contract (J7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install the official SDKs
        # Dev-only installs, outside package manifests on purpose (the
        # contract is exercised with the OFFICIAL clients, not a vendored
        # version): Python SDK into target/sdk-py, JS SDK via npm.
        run: |
          python3 -m pip install --target target/sdk-py openai
          npm install openai
      - name: Run the contract test
        run: python3 scripts/contract_openai_sdk.py

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
