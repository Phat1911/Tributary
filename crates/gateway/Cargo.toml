[package]
name = "tributary-gateway"
description = "Data plane: axum OpenAI-compatible proxy, metering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# GeoLite2 country resolution for the impossible-travel check (SPEC §9).
# OFF by default: the default build carries no GeoIP dependency (dormant
# feature — activated by TRIBUTARY_GEOIP_DB_PATH + this feature together).
geoip = ["dep:maxminddb"]

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
# Optional GeoLite2 reader (feature `geoip`): pure Rust, no C toolchain.
# Justified in PLAN.md per workflow step 10 (mail + geo dep discipline).
maxminddb = { version = "0.32", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tributary-common = { path = "../common" }
tributary-control = { path = "../control" }
tributary-crypto = { path = "../crypto" }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
