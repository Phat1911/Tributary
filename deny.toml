# cargo-deny configuration — supply-chain discipline (AGENTS.md rule 10).
# Docs: https://embarkstudios.github.io/cargo-deny/
# Any allow-list change must be justified in the PLAN.md milestone entry.

[advisories]
version = 2
# M8 (2026-10-30): every id below enters the graph ONLY through the
# dev-dependency chain of the pool program's test harness —
# solana-program-test 4.1.2 → solana-runtime → agave-precompiles etc.
# (i.e. the Anza/agave toolchain's OWN pinned tree; the same versions sit
# in agave v4.1.2's own Cargo.lock). None of these crates compile into a
# release binary: the services never see them, and the on-chain program's
# SBF build resolves independently. Upgrading past them means leaving the
# agave-4.1.2 lattice (A-033), which is a deliberate future decision.
ignore = [
  "RUSTSEC-2022-0093", # bincode 1.x unmaintained — agave tree, dev-only here
  "RUSTSEC-2024-0344", # curve25519-dalek 3.2 timing — ed25519-dalek 1.0.1 (agave-precompiles), dev-only
  "RUSTSEC-2024-0388", # derivative unmaintained — agave tree, dev-only
  "RUSTSEC-2024-0436", # proc-macro-error2 lineage — anchor 1.2 codegen, dev/build-only
  "RUSTSEC-2025-0141", # traitobject — legacy solana tree, dev-only
  "RUSTSEC-2025-0161", # agave-family advisory — dev-only
  "RUSTSEC-2026-0173", # agave-family advisory — dev-only
  "RUSTSEC-2026-0387", # agave-family advisory — dev-only
  "RUSTSEC-2026-0391", # agave-family advisory — dev-only
  "RUSTSEC-2026-0398", # agave-family advisory — dev-only
  "RUSTSEC-2026-0403", # agave-family advisory — dev-only
  # M9-B close-out (2026-11-11): NOT-applicable-by-configuration. sqlx-sqlite
  # 0.9.0 (latest release) resolves libsqlite3-sys >=0.30.1,<0.38.0 with
  # default-features=false and only pkg-config/vcpkg — the `bundled`
  # feature (the ONLY affected configuration per the advisory: SQLite
  # 3.13.0–3.53.2 compiled from the bundled source) is never enabled in
  # this workspace; all builds link the SYSTEM SQLite. The fixed
  # libsqlite3-sys 0.39 is unreachable inside sqlx's range until sqlx
  # ships a compatible release. Revisit on the next sqlx bump: deleting
  # this line IS the revisit test.
  "RUSTSEC-2026-0459", # libsqlite3-sys bundled-source CVE-2026-119375 — we link system sqlite (above)
]

[licenses]
version = 2
# Permissive licenses only. FSL-1.1-ALv2 is this repository's own license.
allow = [
  "FSL-1.1-ALv2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
